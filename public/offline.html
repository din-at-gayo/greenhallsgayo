<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#008037">
<title>Offline — RoomBook</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<style>
  html,body{margin:0;height:100%;background:#f8fafc;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;box-sizing:border-box}
  img{width:72px;height:72px;margin-bottom:20px}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#475569;font-size:15px;line-height:1.5;max-width:320px;margin:0 0 24px}
  button{background:#008037;color:#fff;border:0;border-radius:8px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer}
  button:hover{background:#00662c}
</style>
</head>
<body>
<main>
  <img src="/icons/icon.svg" alt="">
  <h1>You're offline</h1>
  <p>RoomBook needs a connection to show live room availability and your bookings. It will reload automatically when you're back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>addEventListener('online', function () { location.reload() })</script>
</body>
</html>
